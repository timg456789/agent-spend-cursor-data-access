# Publishes to npm on tag push (v*) or manual run.
#
# Setup (no local npm publish required):
# 1. npmjs.com → log in (same browser is fine)
# 2. Profile → Trusted publishing (or npm docs: "Trusted publishers")
# 3. Add GitHub Actions publisher:
#    - Owner: timg456789
#    - Repository: agent-spend-cursor-data-access
#    - Workflow: publish-npm.yml
# 4. Push this repo to GitHub, then tag: npm version patch && git push --follow-tags

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
