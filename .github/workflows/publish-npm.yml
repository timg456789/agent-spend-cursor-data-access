# Trusted publisher: timg456789 / agent-spend-cursor-data-access / publish-npm.yml
# setup-node sets NODE_AUTH_TOKEN from GITHUB_TOKEN when registry-url is set — unset before publish so npm uses OIDC.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'