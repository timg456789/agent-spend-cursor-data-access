# Publishes to npm on semver tag push (0.1.2 or v0.1.2) or manual run.
# Do not also use release:published — publishing a Release creates the tag and would run twice.
# Trusted publisher: timg456789 / agent-spend-cursor-data-access / publish-npm.yml

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish --provenance
