# Publishes to npm on: tag (v0.1.1 or 0.1.1), GitHub Release published, or manual run.
# Trusted publisher on npm: timg456789 / agent-spend-cursor-data-access / publish-npm.yml

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Publish package
        run: npm publish --provenance
