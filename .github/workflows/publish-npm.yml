# Publish with NPM_TOKEN (repo secret).
# npm → Access Tokens (write on this package) → GitHub Settings → Secrets → NPM_TOKEN

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Upgrade npm & Publish
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public